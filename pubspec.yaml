name: flutter_lessons
description: "Runnable examples for daily Flutter lessons"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Every markdown file in lessons/ is bundled, so a new lesson file is
  # picked up without editing this list.
  assets:
    - lessons/
